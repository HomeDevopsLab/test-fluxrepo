apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: shy-garlic
  namespace: default
spec:
  interval: 1m
  chart:
    spec:
      chart: ./chart
      sourceRef:
        kind: GitRepository
        name: appchart-322
        namespace: default
      interval: 1m
  values:
    replicaCount: 1
    image:
      imagePolicy: false
      repository: ghcr.io/zatto-dev/shy-garlic
      tag: 0.14.0
    env:
      - name: SHYG_CONFIG
        value: /etc/shygarlic/shygarlic.yaml
      - name: SHYG_DATA
        value: /data/shygarlic.db
      - name: TZ
        value: Europe/Warsaw
    resources:
      limits:
        memory: 1Gi
        cpu: 1
      requests:
        memory: 512Mi
        cpu: 200m
    services:
      - name: shy-garlic
        protocol: "TCP"
        servicePort: 8080
        targetPort: 8080
    ingress:
      enabled: true
      ssl: false
      hosts:
        - name: garlic.lan
          servicePort: 8080
    volumes:
      ownership: 0:0
      nfs:
        server: srv-storage.lan
        path: /storage
        mountPath:
          - config:/etc/shygarlic
          - data:/data
