apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: it-tools
  namespace: default
spec:
  interval: 1m
  chart:
    spec:
      chart: ./chart
      sourceRef:
        kind: GitRepository
        name: appchart-322
        namespace: default
      interval: 1m
  values:
    replicaCount: 1
    image:
      imagePolicy: false
      repository: corentinth/it-tools
      tag: latest
    resources:
      limits:
        memory: 1Gi
        cpu: 1
      requests:
        memory: 512Mi
        cpu: 200m
    services:
      - name: it-tools
        protocol: "TCP"
        servicePort: 80
        targetPort: 80
    ingress:
      enabled: true
      ssl: false
      hosts:
        - name: it-tools.lan
          servicePort: 80
    volumes:
      enabled: false
